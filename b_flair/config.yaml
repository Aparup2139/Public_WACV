# b_flair/config.yaml
paths:
  data_root: "data/b_flair"            # override with BFLAIR_DATA_ROOT
  metadata_path: "data/b_flair/metadata.json"
  checkpoint_path: "s2looking/qgmamba_s2looking_best.pt"  # zero-shot transfer source
  checkpoint_hf_repo: null             # same published S2Looking model repository
  checkpoint_hf_filename: "qgmamba_s2looking_best.pt"
  model_config_path: "config/levir_cd_accuracy_4x40gb.yaml"  # must match checkpoint architecture, NOT configs/bflair_cd_paper.yaml
  output_dir: "b_flair/results"

eval:
  tile_size: 256
  tile_stride: 256
  final_stride: 128
  d4_tta: false

threshold_grid:
  reference_only: [0.05, 0.925, 0.025]   # in-sample reference curve only -- operating threshold comes from the checkpoint's stored value, per the original notebook's zero-shot protocol
